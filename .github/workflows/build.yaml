name: Build WAR and Docker Image

on:
  push:
    branches: [main]  # or your branch name
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
       
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build WAR file with Maven
        run: ./gradlew clean build --x test

      - name: Upload WAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: build/libs/docker-demo-0.0.1-SNAPSHOT.war
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/docker-demo:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/docker-demo:latest

